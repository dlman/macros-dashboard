name: Validate Dashboard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: dashboard-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-sync.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-sync.txt

      - name: Validate dashboard
        run: python scripts/validate_dashboard_build.py
